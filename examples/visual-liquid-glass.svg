<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bgLG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070C"/><stop offset="0.55" stop-color="#0B0B0D"/><stop offset="1" stop-color="#080E1B"/>
    </linearGradient>
    <radialGradient id="waveB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0D6EFD" stop-opacity="0.95"/><stop offset="1" stop-color="#0D6EFD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="waveS" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C0C4CC" stop-opacity="0.55"/><stop offset="1" stop-color="#C0C4CC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chipS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/><stop offset="0.5" stop-color="#C0C4CC" stop-opacity="0.85"/><stop offset="1" stop-color="#7E8798" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="chipK" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3F47"/><stop offset="0.55" stop-color="#0B0B0D"/><stop offset="1" stop-color="#23262C"/>
    </linearGradient>
    <linearGradient id="chipB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6FA8FF"/><stop offset="0.5" stop-color="#0D6EFD"/><stop offset="1" stop-color="#00CFFF" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="panelLG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/><stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.05"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="btnLG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B96FF"/><stop offset="1" stop-color="#0D6EFD"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="cutPanel"><polygon points="64,84 576,84 600,108 600,336 576,360 64,360 40,336 40,108"/></clipPath>
  </defs>
  <rect width="640" height="400" fill="url(#bgLG)"/>
  <!-- liquid waves behind glass -->
  <ellipse cx="150" cy="70" rx="230" ry="110" fill="url(#waveS)" filter="url(#soft)"/>
  <ellipse cx="520" cy="330" rx="280" ry="130" fill="url(#waveB)" filter="url(#soft)"/>
  <ellipse cx="430" cy="90" rx="170" ry="80" fill="url(#waveB)" filter="url(#soft2)" opacity="0.7"/>
  <text x="40" y="58" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">Liquid Glass — Full</text>
  <!-- glass panel -->
  <g clip-path="url(#cutPanel)">
    <rect x="40" y="84" width="560" height="276" fill="url(#panelLG)"/>
    <ellipse cx="150" cy="90" rx="220" ry="100" fill="url(#waveS)" filter="url(#soft)"/>
    <ellipse cx="520" cy="340" rx="260" ry="120" fill="url(#waveB)" filter="url(#soft)"/>
    <polygon points="250,60 340,60 190,380 100,380" fill="#FFFFFF" opacity="0.07"/>
  </g>
  <polygon points="64,84 576,84 600,108 600,336 576,360 64,360 40,336 40,108" fill="none" stroke="#C0C4CC" stroke-opacity="0.55" stroke-width="1.5"/>
  <polygon points="64,84 576,84 600,108" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="1.5"/>
  <!-- glossy chips -->
  <g>
    <polygon points="80,112 144,112 156,124 156,188 144,200 80,200 68,188 68,124" fill="url(#chipS)"/>
    <polygon points="184,112 248,112 260,124 260,188 248,200 184,200 172,188 172,124" fill="url(#chipK)" stroke="#C0C4CC" stroke-opacity="0.35"/>
    <polygon points="288,112 352,112 364,124 364,188 352,200 288,200 276,188 276,124" fill="url(#chipB)"/>
    <polygon points="80,112 144,112 156,124 156,140 68,140 68,124" fill="#FFFFFF" opacity="0.35"/>
  </g>
  <text x="68" y="228" font-family="Inter, sans-serif" font-size="15" fill="#E2E7F0">Silver</text>
  <text x="172" y="228" font-family="Inter, sans-serif" font-size="15" fill="#E2E7F0">Hitam</text>
  <text x="276" y="228" font-family="Inter, sans-serif" font-size="15" fill="#E2E7F0">Biru</text>
  <rect x="396" y="112" width="176" height="20" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="396" y="148" width="140" height="14" fill="#FFFFFF" fill-opacity="0.45"/>
  <rect x="396" y="172" width="156" height="14" fill="#FFFFFF" fill-opacity="0.45"/>
  <!-- primary button, angular -->
  <polygon points="80,262 246,262 258,274 258,306 246,318 80,318 68,306 68,274" fill="url(#btnLG)"/>
  <text x="163" y="297" font-family="Inter, sans-serif" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle">Liquid Glass</text>
  <!-- glass icon tiles -->
  <polygon points="294,262 338,262 350,274 350,306 338,318 294,318 282,306 282,274" fill="#FFFFFF" fill-opacity="0.10" stroke="#C0C4CC" stroke-opacity="0.5"/>
  <polygon points="366,262 410,262 422,274 422,306 410,318 366,318 354,306 354,274" fill="#0D6EFD" fill-opacity="0.85"/>
  <!-- toggle -->
  <rect x="452" y="266" width="104" height="48" rx="24" fill="#0D6EFD"/>
  <circle cx="522" cy="290" r="19" fill="#FFFFFF"/>
</svg>
