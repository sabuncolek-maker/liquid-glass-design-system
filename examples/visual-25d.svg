<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg25" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101B30"/><stop offset="1" stop-color="#080E1B"/>
    </linearGradient>
    <linearGradient id="silv25" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDF1F7"/><stop offset="1" stop-color="#9AA3B2"/>
    </linearGradient>
    <linearGradient id="blue25" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4D8DFF"/><stop offset="1" stop-color="#0A58D6"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg25)"/>
  <text x="40" y="58" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#E2E7F0">2.5D — Layered Depth</text>
  <!-- panel shadow layers -->
  <rect x="52" y="100" width="560" height="276" fill="#000000" opacity="0.45"/>
  <rect x="46" y="92" width="560" height="276" fill="#232E42"/>
  <rect x="40" y="84" width="560" height="276" fill="#C7CDD8"/>
  <!-- chips with extrusion -->
  <g>
    <rect x="76" y="124" width="88" height="88" fill="#6E7684"/>
    <rect x="68" y="112" width="88" height="88" fill="url(#silv25)"/>
    <rect x="180" y="124" width="88" height="88" fill="#000000"/>
    <rect x="172" y="112" width="88" height="88" fill="#151517"/>
    <rect x="284" y="124" width="88" height="88" fill="#063E96"/>
    <rect x="276" y="112" width="88" height="88" fill="url(#blue25)"/>
  </g>
  <text x="68" y="240" font-family="Inter, sans-serif" font-size="15" fill="#0B0B0D">Silver</text>
  <text x="172" y="240" font-family="Inter, sans-serif" font-size="15" fill="#0B0B0D">Hitam</text>
  <text x="276" y="240" font-family="Inter, sans-serif" font-size="15" fill="#0B0B0D">Biru</text>
  <rect x="396" y="112" width="176" height="20" fill="#0B0B0D" fill-opacity="0.8"/>
  <rect x="396" y="148" width="140" height="14" fill="#0B0B0D" fill-opacity="0.45"/>
  <rect x="396" y="172" width="156" height="14" fill="#0B0B0D" fill-opacity="0.45"/>
  <!-- stacked plates -->
  <g>
    <rect x="452" y="300" width="104" height="20" fill="#0B0B0D"/>
    <rect x="452" y="282" width="104" height="20" fill="#0D6EFD"/>
    <rect x="452" y="264" width="104" height="20" fill="url(#silv25)"/>
  </g>
  <!-- button with depth -->
  <rect x="68" y="270" width="190" height="56" fill="#063E96"/>
  <rect x="68" y="262" width="190" height="56" fill="url(#blue25)"/>
  <text x="163" y="297" font-family="Inter, sans-serif" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle">Tombol Utama</text>
  <rect x="282" y="268" width="56" height="56" fill="#6E7684"/>
  <rect x="282" y="262" width="56" height="56" fill="url(#silv25)"/>
  <rect x="354" y="268" width="56" height="56" fill="#000000"/>
  <rect x="354" y="262" width="56" height="56" fill="#151517"/>
  <rect x="426" y="268" width="56" height="56" fill="#6E7684"/>
  <rect x="426" y="262" width="56" height="56" fill="url(#silv25)"/>
</svg>
